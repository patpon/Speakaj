name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: Speakaj-windows.zip
          - os: macos-latest
            asset: Speakaj-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python build.py
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Speakaj.exe, README.md, .env.example -DestinationPath ${{ matrix.asset }}
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = "${{ github.event.release.tag_name || github.ref_name }}".TrimStart("v")
          if ($ver -notmatch '^\d') { $ver = "0.0.0" }
          & $iscc "/DAppVersion=$ver" installer\speakaj.iss
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Speakaj-Setup.exe
          path: dist/Speakaj-Setup.exe
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Speakaj.app ../${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            ${{ matrix.asset }}
            dist/Speakaj-Setup.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
