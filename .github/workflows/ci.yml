name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb
      - run: pip install -r requirements.txt pytest
      - name: Test (Linux, virtual display for pynput)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Test
        if: runner.os != 'Linux'
        run: pytest -q
